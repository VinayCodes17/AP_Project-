<div class="contact-page">
  <div class="section-tag">Support</div>
  <div class="section-title">Contact our team</div>
  <p style="color:var(--gray);text-align:center;max-width:600px;margin:0 auto 3rem">Have questions or found an error in the data? Drop us a message below and we'll get back to you.</p>

  <div class="contact-container">
    <div class="contact-info">
      <div class="ci-item">
        <div class="ci-icon">📍</div>
        <div>
          <h4>Location</h4>
          <p>Campus Career Centre, Floor 2</p>
        </div>
      </div>
      <div class="ci-item">
        <div class="ci-icon">📧</div>
        <div>
          <h4>Email</h4>
          <p>support@placetrack.edu</p>
        </div>
      </div>
      <div class="ci-item">
        <div class="ci-icon">⏰</div>
        <div>
          <h4>Hours</h4>
          <p>Mon - Fri, 9:00 - 17:00</p>
        </div>
      </div>
    </div>

    <form class="contact-form" id="contact-form" onsubmit="event.preventDefault(); handleSubmitSupport();">
      <div class="form-row">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="c_name" placeholder="John Doe" required />
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="c_email" placeholder="john@example.com" required />
        </div>
      </div>
      <div class="form-group">
        <label>Subject</label>
        <input type="text" id="c_subject" placeholder="Data Correction / General Query" required />
      </div>
      <div class="form-group">
        <label>Message</label>
        <textarea id="c_message" rows="5" placeholder="Tell us more..." required></textarea>
      </div>
      <button type="submit" class="btn-primary" style="width:100%">Send Message</button>
      <div id="contact-success" class="success-msg" style="display:none;margin-top:1rem">
        ✅ Your message has been sent successfully!
      </div>
    </form>
  </div>
</div>
